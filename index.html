<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammet Turşak (Tursak) | AI-Enabled Senior Software Architect</title>
    <meta name="author" content="Muhammet Turşak" />
    <meta name="theme-color" content="#090811" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="me" href="https://github.com/tursoft" />
    <link rel="me" href="https://www.linkedin.com/in/tursoft/" />
    <!--
      Description, canonical, Open Graph, Twitter card and JSON-LD are rendered per route
      by src/components/Seo.tsx and baked into static HTML by scripts/prerender.mjs.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect — restore path from query param set by 404.html
      (function() {
        var p = window.location.search.slice(1);
        if (p.startsWith('p=')) {
          var path = decodeURIComponent(p.slice(2));
          window.history.replaceState(null, null, path);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
