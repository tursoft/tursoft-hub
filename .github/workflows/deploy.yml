name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the prod branch
  push:
    branches: ["prod"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Cancel any in-progress run so only
# the latest push gets deployed and duplicate artifacts are avoided.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Puppeteer downloads Chrome for the prerender step; cache it between runs.
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # vite build, then scripts/postbuild.mjs: sitemap.xml, llms-full.txt and
      # static prerendering of every route (fails the build on an empty page).
      - name: Build and prerender
        run: npm run build

      - name: Verify prerendered output
        run: |
          test -f dist/sitemap.xml
          test -f dist/llms-full.txt
          test -f dist/privacy/amelbook/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q '<h2' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist repository
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
